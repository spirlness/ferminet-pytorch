[project]
name = "ferminet-pytorch"
version = "0.1.0"
description = "A clean PyTorch implementation of FermiNet for ab-initio quantum chemistry"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "torch>=2.0.0",
    # visualize.py 与 test_visualize.py 直接导入 numpy / matplotlib；此前未声明，
    # 导致 `uv sync` 产出的环境里可视化模块与约 56 项测试无法导入。
    "numpy>=1.21",
    "matplotlib>=3.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
