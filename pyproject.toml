[project]
name = "ferminet-pytorch"
version = "0.3.0"
description = "Neural wavefunctions and variational Monte Carlo in PyTorch"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["torch>=2.0.0", "numpy>=1.21"]

[project.scripts]
ferminet-train = "ferminet_pytorch.train_vmc:main"
ferminet-validate = "ferminet_pytorch.physics_validation:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ferminet_pytorch"]

[tool.hatch.build.targets.sdist]
include = [
    "/ferminet_pytorch", "/tests", "/scripts", "/examples", "/configs", "/kaggle",
    "/pyproject.toml", "/uv.lock", "/*.md",
]
