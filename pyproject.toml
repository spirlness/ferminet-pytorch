[project]
name = "ferminet-pytorch"
version = "0.1.0"
description = "A clean PyTorch implementation of FermiNet for ab-initio quantum chemistry"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
dev-mode-dirs = ["."]
only-include = [
    "__init__.py",
    "features.py",
    "layers.py",
    "envelope.py",
    "jastrow.py",
    "spin.py",
    "model.py",
    "hamiltonian.py",
    "mcmc.py",
    "loss.py",
    "train_vmc.py",
    "example_h2.py",
]

[tool.hatch.build.targets.wheel.sources]
"" = "ferminet_pytorch"

[tool.hatch.build.targets.sdist]
only-include = [
    "pyproject.toml",
    "README.md",
    "BEGINNER_GUIDE.md",
    "__init__.py",
    "features.py",
    "layers.py",
    "envelope.py",
    "jastrow.py",
    "spin.py",
    "model.py",
    "hamiltonian.py",
    "mcmc.py",
    "loss.py",
    "train_vmc.py",
    "example_h2.py",
    "ferminet_pytorch",
]
