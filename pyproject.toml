[project]
name = "ferminet-pytorch"
version = "0.1.0"
description = "A clean PyTorch implementation of FermiNet for ab-initio quantum chemistry"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "torch>=2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
